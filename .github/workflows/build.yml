name: Build ARMGDDN Browser

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.3 (leave blank to use the VERSION file)'
        required: false
        default: ''

env:
  QT_VERSION: '6.10.3'

jobs:
  build_windows:
    name: Windows Build (x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(cat VERSION | tr -d '[:space:]')"
          fi
          # Bake the version into the VERSION file so the About box matches
          printf '%s' "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building ARMGDDN Browser v$V"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'

      - name: Build ARMGDDN Browser
        run: |
          mkdir build
          cd build
          # Let CMake auto-detect the newest installed Visual Studio generator
          # (windows-latest ships VS 2026, not VS 2022).
          cmake -A x64 -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" ..
          cmake --build . --config Release
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --no-translations --no-compiler-runtime --no-svg ".\build\Release\ARMGDDNBrowser.exe"

      - name: Stage portable package
        shell: bash
        run: |
          mkdir -p "package/ARMGDDN Browser"
          cp -r build/build/Release/* "package/ARMGDDN Browser/"
          # An ARMGDDNBrowser.ini next to ARMGDDNBrowser.exe makes the app run
          # in portable mode. It carries only comments (effectively blank) - a
          # zero-byte file can be dropped by upload-artifact, so we add a header.
          printf '%s\n' \
            '; ARMGDDN Browser portable configuration' \
            '; This file existing next to ARMGDDNBrowser.exe enables portable mode.' \
            '; Define mirror folders under a [RemoteFolders] group, e.g.:' \
            ';   [RemoteFolders]' \
            ';   Titles=TO-*' \
            ';   Stuff=Stuff-* / ftp' \
            > "package/ARMGDDN Browser/ARMGDDNBrowser.ini"

      # Name the artifact after the release so downloading it from the Actions
      # run gives "ARMGDDN.Browser.vX.X.X.zip", not "windows.zip"; the "ARMGDDN
      # Browser" folder is preserved inside it.
      - uses: actions/upload-artifact@v4
        with:
          name: ARMGDDN.Browser.v${{ steps.ver.outputs.version }}
          path: package/*

  create_release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [build_windows]
    # Only cut a release when manually dispatched (optionally with a version).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # release-action pushes a tag/release, which needs write access to contents.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ARMGDDN.Browser.v${{ needs.build_windows.outputs.version }}
          path: package

      - name: Zip portable package
        run: |
          V="${{ needs.build_windows.outputs.version }}"
          cd package
          # package/ contains the "ARMGDDN Browser" folder; keep it inside the zip
          zip -r -0 "../ARMGDDN.Browser.v${V}.zip" "ARMGDDN Browser"
          cd ..
          ls -la "ARMGDDN.Browser.v${V}.zip"

      # Build the release body = curated highlights (RELEASE_HIGHLIGHTS.md, which
      # DMP edits before dispatching) followed by GitHub's auto-generated
      # commit/PR list. This same body is what the in-app update popup shows as
      # the changelog, so it stays user-facing.
      - name: Compose release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          V="${{ needs.build_windows.outputs.version }}"

          # Auto-generated "What's Changed" list (previous tag auto-detected).
          GENERATED="$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="v${V}" \
            -f target_commitish="${{ github.sha }}" \
            --jq '.body' 2>/dev/null || true)"

          {
            if [ -f RELEASE_HIGHLIGHTS.md ]; then
              # Strip HTML comments (author guidance) so they don't ship.
              sed '/<!--/,/-->/d' RELEASE_HIGHLIGHTS.md
              echo ""
            fi
            if [ -n "$GENERATED" ]; then
              echo "$GENERATED"
            fi
          } > RELEASE_BODY.md

          echo "----- release body -----"
          cat RELEASE_BODY.md

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "ARMGDDN.Browser.v*.zip"
          name: ARMGDDN Browser v${{ needs.build_windows.outputs.version }}
          tag: v${{ needs.build_windows.outputs.version }}
          draft: true
          allowUpdates: true
          bodyFile: RELEASE_BODY.md
