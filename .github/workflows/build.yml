name: Build ARMGDDN Browser

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.3 (leave blank to use the VERSION file)'
        required: false
        default: ''

env:
  QT_VERSION: '6.10.3'

jobs:
  build_windows:
    name: Windows Build (x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(cat VERSION | tr -d '[:space:]')"
          fi
          # Bake the version into the VERSION file so the About box matches
          printf '%s' "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building ARMGDDN Browser v$V"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'

      - name: Build ARMGDDN Browser
        run: |
          mkdir build
          cd build
          # Let CMake auto-detect the newest installed Visual Studio generator
          # (windows-latest ships VS 2026, not VS 2022).
          cmake -A x64 -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" ..
          cmake --build . --config Release
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --no-translations --no-compiler-runtime --no-svg ".\build\Release\ARMGDDNBrowser.exe"

      - name: Stage portable package
        shell: bash
        run: |
          mkdir -p package
          cp -r build/build/Release/* package/
          # A blank ARMGDDNBrowser.ini next to ARMGDDNBrowser.exe makes the
          # app run in portable mode.
          : > "package/ARMGDDNBrowser.ini"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: package/*

  create_release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [build_windows]
    # Only cut a release when manually dispatched (optionally with a version).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # release-action pushes a tag/release, which needs write access to contents.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: package

      - name: Zip portable package
        run: |
          V="${{ needs.build_windows.outputs.version }}"
          cd package
          zip -r -0 "../ARMGDDN Browser v${V}.zip" .
          cd ..
          ls -la "ARMGDDN Browser v${V}.zip"

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "ARMGDDN Browser v*.zip"
          name: ARMGDDN Browser v${{ needs.build_windows.outputs.version }}
          tag: v${{ needs.build_windows.outputs.version }}
          draft: true
          allowUpdates: true
          omitBody: true
          generateReleaseNotes: true
